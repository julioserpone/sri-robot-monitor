name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: Análisis de seguridad
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Inicializar CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: swift

      - name: Compilar para CodeQL
        run: |
          xcodebuild -project SriRobotMonitor.xcodeproj \
            -scheme SriRobotMonitor \
            -configuration Debug \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Analizar
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:swift"

name: CI

# Verificación en GitHub: compila y corre las pruebas en macOS.
#
# La higiene (documentos, secretos, YAML) se comprueba en local con
# `./scripts/verify.sh --quick`, que es instantáneo y no gasta minutos.
# Aquí solo queda lo que sí necesita un Mac de verdad.
#
# CodeQL se retiró: con Swift compila el proyecto entero y consumía la cuota
# gratuita (más de 10 minutos por ejecución) para poco valor en una app local.
# Para auditar seguridad, ejecuta `./scripts/verify.sh` en el Mac.

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: Compilar y probar (macOS)
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Resolver dependencias
        run: xcodebuild -project SriRobotMonitor.xcodeproj -scheme SriRobotMonitor -resolvePackageDependencies

      - name: Compilar
        run: |
          set -o pipefail
          xcodebuild -project SriRobotMonitor.xcodeproj \
            -scheme SriRobotMonitor \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee build.log | grep -E 'error:|warning:|BUILD (SUCCEEDED|FAILED)' || true
          if ! grep -qE '\*\* BUILD SUCCEEDED \*\*' build.log; then
            grep -E 'error:' build.log | head -50 | while read -r line; do echo "::error::$line"; done
            tail -40 build.log
            exit 1
          fi

      - name: Pruebas unitarias
        run: |
          set -o pipefail
          xcodebuild -project SriRobotMonitor.xcodeproj \
            -scheme SriRobotMonitor \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath build \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            test 2>&1 | tee test.log | grep -E 'Test Suite|error:|\*\* TEST' || true
          if ! grep -qE '\*\* TEST SUCCEEDED \*\*' test.log; then
            grep -E 'error:|failed' test.log | head -40 | while read -r line; do echo "::error::$line"; done
            tail -60 test.log
            exit 1
          fi
          grep -E 'Executed [0-9]+ test' test.log | tail -1 >> "$GITHUB_STEP_SUMMARY" || true

      - name: Subir resultados de pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults.xcresult
          if-no-files-found: ignore
          retention-days: 7

name: CI

# Compila y corre las pruebas en macOS. Solo en pull requests: la rama main
# recibe código únicamente a través de PR, así que un push a main no vuelve a
# gastar minutos de Actions.
#
# La higiene (documentos, secretos, YAML) se comprueba en local con
# `./scripts/verify.sh --quick`, que es instantáneo y no gasta cuota.
#
# CodeQL se retiró: con Swift compila el proyecto entero y consume la cuota
# gratuita (más de 10 minutos por ejecución) para poco valor en una app local.
#
# Las actions están en v7 (releases de 2026), que corren sobre Node 24 y ya no
# emiten el aviso de deprecación de Node 20.

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: Compilar y probar (macOS)
    runs-on: macos-26
    # Sin límite, un build colgado consume la cuota hasta el máximo de 6 h.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Entorno
        run: |
          sw_vers
          xcodebuild -version

      - name: Compilar
        run: |
          set -o pipefail
          xcodebuild -project SriRobotMonitor.xcodeproj \
            -scheme SriRobotMonitor \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee build.log | grep -E 'error:|warning:|BUILD (SUCCEEDED|FAILED)' || true
          if ! grep -qE '\*\* BUILD SUCCEEDED \*\*' build.log; then
            grep -E 'error:' build.log | head -50 | while read -r line; do echo "::error::$line"; done
            tail -40 build.log
            exit 1
          fi

      - name: Pruebas unitarias
        run: |
          set -o pipefail
          xcodebuild -project SriRobotMonitor.xcodeproj \
            -scheme SriRobotMonitor \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath build \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            test 2>&1 | tee test.log | grep -E 'Test Suite|error:|\*\* TEST' || true
          if ! grep -qE '\*\* TEST SUCCEEDED \*\*' test.log; then
            grep -E 'error:|failed' test.log | head -40 | while read -r line; do echo "::error::$line"; done
            tail -60 test.log
            exit 1
          fi
          grep -E 'Executed [0-9]+ test' test.log | tail -1 >> "$GITHUB_STEP_SUMMARY" || true

      - name: Subir resultados de pruebas
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: TestResults.xcresult
          if-no-files-found: ignore
          retention-days: 7

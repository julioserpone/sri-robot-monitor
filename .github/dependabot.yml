version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/Guayaquil"
    open-pull-requests-limit: 5
    labels:
      - "dependencias"
      - "ci"
    commit-message:
      prefix: "chore(actions)"
    groups:
      github-actions:
        patterns:
          - "*"

  # El proyecto no usa paquetes Swift a propósito, pero si algún día se añade
  # un `Package.swift`, Dependabot lo actualizará sin tocar la configuración.
  - package-ecosystem: "swift"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    labels:
      - "dependencias"
    commit-message:
      prefix: "chore(deps)"

name: SriRobotMonitor

options:
  bundleIdPrefix: com.julioserpone
  deploymentTarget:
    macOS: "26.0"
  xcodeVersion: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    MARKETING_VERSION: "1.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: YES
    DEAD_CODE_STRIPPING: YES
    CLANG_ENABLE_MODULES: YES

targets:
  SriRobotMonitor:
    type: application
    platform: macOS
    sources:
      - path: SriRobotMonitor
        excludes:
          - "Resources/Info.plist"
    info:
      path: SriRobotMonitor/Resources/Info.plist
      properties:
        CFBundleDisplayName: SRI Robot Monitor
        CFBundleName: SriRobotMonitor
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.developer-tools
        LSMinimumSystemVersion: "26.0"
        NSHumanReadableCopyright: "© 2026 Julio Serpone. MIT License."
        NSPrincipalClass: NSApplication
        NSHighResolutionCapable: true
        NSSupportsAutomaticGraphicsSwitching: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.julioserpone.sri-robot-monitor
        PRODUCT_NAME: SriRobotMonitor
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: SriRobotMonitor/SriRobotMonitor.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_APP_SANDBOX: YES
        COMBINE_HIDPI_IMAGES: YES
    entitlements:
      path: SriRobotMonitor/SriRobotMonitor.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.files.user-selected.read-only: true
    dependencies: []

  SriRobotMonitorTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/SriRobotMonitorTests
    dependencies:
      - target: SriRobotMonitor
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.julioserpone.sri-robot-monitor.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/SriRobotMonitor.app/Contents/MacOS/SriRobotMonitor"
        BUNDLE_LOADER: "$(TEST_HOST)"
        CODE_SIGN_ENTITLEMENTS: ""

schemes:
  SriRobotMonitor:
    build:
      targets:
        SriRobotMonitor: all
        SriRobotMonitorTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - SriRobotMonitorTests
    archive:
      config: Release
